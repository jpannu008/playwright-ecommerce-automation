name: Checkout QA

on:
  push:
    branches: [main]
    paths:
      - 'tests/**'
      - 'package*.json'
      - 'playwright.config.ts'
      - '.github/workflows/playwright.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkout-qa-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
